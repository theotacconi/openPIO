<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="t d">
<title id="t">The demo parts</title>
<desc id="d">The Pico&#x27;s VBUS (pin 40) through a 1N4007, stripe towards the ring, to the ring&#x27;s 5V; the Pico&#x27;s GND (pin 38) to the ring&#x27;s GND and the IR receiver&#x27;s minus; the Pico&#x27;s 3V3(OUT) (pin 36) to the IR receiver&#x27;s plus; the receiver&#x27;s S to FPGA pin 27 (pio 0); FPGA pin 28 (pio 1) through 330 ohm to the ring&#x27;s DI.</desc>
