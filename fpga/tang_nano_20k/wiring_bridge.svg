<text x="778" y="332" class="pin" text-anchor="end">GP27</text>
<circle cx="814" cy="302" r="6" class="free"/>
<text x="800" y="306" class="num" text-anchor="end">33</text>
<text x="778" y="306" class="pin" text-anchor="end">GND</text>
<circle cx="814" cy="276" r="6" class="free"/>
<text x="800" y="280" class="num" text-anchor="end">34</text>
<text x="778" y="280" class="pin" text-anchor="end">GP28</text>
<circle cx="814" cy="250" r="6" class="free"/>
