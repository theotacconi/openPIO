<text x="800" y="540" class="num" text-anchor="end">24</text>
<text x="778" y="540" class="pin" text-anchor="end">GP18</text>
<circle cx="814" cy="510" r="6" class="free"/>
<text x="800" y="514" class="num" text-anchor="end">25</text>
<text x="778" y="514" class="pin" text-anchor="end">GP19</text>
<circle cx="814" cy="484" r="6" class="free"/>
<text x="800" y="488" class="num" text-anchor="end">26</text>
<text x="778" y="488" class="pin" text-anchor="end">GP20</text>
<circle cx="814" cy="458" r="6" class="free"/>
<text x="800" y="462" class="num" text-anchor="end">27</text>
<text x="778" y="462" class="pin" text-anchor="end">GP21</text>
<circle cx="814" cy="432" r="6" class="free"/>
