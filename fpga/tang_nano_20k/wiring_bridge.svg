<text x="778" y="436" class="pin" text-anchor="end">GND</text>
<circle cx="814" cy="406" r="6" class="free"/>
<text x="800" y="410" class="num" text-anchor="end">29</text>
<text x="778" y="410" class="pin" text-anchor="end">GP22</text>
<circle cx="814" cy="380" r="6" class="free"/>
<text x="800" y="384" class="num" text-anchor="end">30</text>
<text x="778" y="384" class="pin" text-anchor="end">RUN</text>
