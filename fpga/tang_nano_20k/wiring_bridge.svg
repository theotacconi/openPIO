<text x="800" y="124" class="num" text-anchor="end">40</text>
<text x="778" y="124" class="pin" text-anchor="end">VBUS</text>
<rect x="60" y="50" width="250" height="648" rx="10" class="tang"/>
<text x="80" y="84" class="title" text-anchor="start">Tang Nano 20K</text>
<text x="80" y="104" class="sub" text-anchor="start">FPGA pin number, header</text>
<polyline points="310,172 616,172" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="310" cy="172" r="4.5" fill="#111827"/>
<text x="296" y="176" class="term" text-anchor="end">GND  J5 or J6</text>
<text x="463.0" y="165" class="wire" text-anchor="middle" style="fill:#111827">GND</text>
<polyline points="310,198 616,198" fill="none" stroke="#d97706" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="310" cy="198" r="4.5" fill="#d97706"/>
<text x="296" y="202" class="term" text-anchor="end">73  J6</text>
<text x="463.0" y="191" class="wire" text-anchor="middle" style="fill:#d97706">SCLK</text>
<polygon points="508.0,198 521.0,192 521.0,204" fill="#d97706"/>
<polyline points="310,224 616,224" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="310" cy="224" r="4.5" fill="#2563eb"/>
<text x="296" y="228" class="term" text-anchor="end">74  J6</text>
<text x="463.0" y="217" class="wire" text-anchor="middle" style="fill:#2563eb">MOSI</text>
<polygon points="508.0,224 521.0,218 521.0,230" fill="#2563eb"/>
<polyline points="310,250 616,250" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="310" cy="250" r="4.5" fill="#16a34a"/>
<text x="296" y="254" class="term" text-anchor="end">75  J5</text>
<text x="463.0" y="243" class="wire" text-anchor="middle" style="fill:#16a34a">MISO</text>
<polygon points="418.0,250 405.0,244 405.0,256" fill="#16a34a"/>
<polyline points="310,276 616,276" fill="none" stroke="#9333ea" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="310" cy="276" r="4.5" fill="#9333ea"/>
<text x="296" y="280" class="term" text-anchor="end">76  J6</text>
<text x="463.0" y="269" class="wire" text-anchor="middle" style="fill:#9333ea">CS_N</text>
<polygon points="508.0,276 521.0,270 521.0,282" fill="#9333ea"/>
<polyline points="310,328 616,328" fill="none" stroke="#0891b2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="310" cy="328" r="4.5" fill="#0891b2"/>
<text x="296" y="332" class="term" text-anchor="end">86  J5</text>
<text x="463.0" y="321" class="wire" text-anchor="middle" style="fill:#0891b2">HOST_IRQ</text>
<polygon points="418.0,328 405.0,322 405.0,334" fill="#0891b2"/>
<text x="80" y="380" class="note" text-anchor="start">The pins of the chip, pio 0-7:</text>
<text x="80" y="400" class="note" text-anchor="start">27 28 29 30 31  on J6</text>
<text x="80" y="420" class="note" text-anchor="start">41 42 48  on J5</text>
<text x="80" y="440" class="note" text-anchor="start"></text>
<text x="80" y="460" class="note" text-anchor="start">Leave the LCD connector</text>
<text x="80" y="480" class="note" text-anchor="start">empty: it shares them.</text>
<text x="450" y="726" class="note" text-anchor="middle">Arrows: the way the signal goes. Both boards take power from their own USB cable.</text>
</svg>
