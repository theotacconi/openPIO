<text x="630" y="488" class="num" text-anchor="start">15</text>
<text x="652" y="488" class="pin" text-anchor="start">GP11</text>
<circle cx="616" cy="510" r="6" class="free"/>
<text x="630" y="514" class="num" text-anchor="start">16</text>
<text x="652" y="514" class="pin" text-anchor="start">GP12</text>
<circle cx="616" cy="536" r="6" class="free"/>
<text x="630" y="540" class="num" text-anchor="start">17</text>
<text x="652" y="540" class="pin" text-anchor="start">GP13</text>
<circle cx="616" cy="562" r="6" class="free"/>
<text x="630" y="566" class="num" text-anchor="start">18</text>
<text x="652" y="566" class="pin" text-anchor="start">GND</text>
<circle cx="616" cy="588" r="6" class="free"/>
<text x="630" y="592" class="num" text-anchor="start">19</text>
<text x="652" y="592" class="pin" text-anchor="start">GP14</text>
