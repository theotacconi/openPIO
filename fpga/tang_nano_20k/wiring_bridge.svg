<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" role="img" aria-labelledby="t d">
<title id="t">Pico to Tang Nano 20K</title>
<desc id="d">Six jumper wires: GP2 pin 4 to FPGA pin 73 (SCLK), GP3 pin 5 to 74 (MOSI), GP4 pin 6 to 75 (MISO), GP5 pin 7 to 76 (CS_N), GP6 pin 9 to 86 (HOST_IRQ), GND pin 3 to a GND pin of the Tang Nano.</desc>
<style>
.bg { fill: #ffffff; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
.title { font-size: 17px; font-weight: 700; }
.sub { font-size: 12px; fill: #52606d; }
.pin { font-size: 11.5px; fill: #9aa5b1; }
.pinu { font-size: 12px; font-weight: 700; fill: #1f2933; }
.num { font-size: 10.5px; fill: #9aa5b1; }
.numu { font-size: 10.5px; font-weight: 700; fill: #1f2933; }
.wire { font-size: 12.5px; font-weight: 700; }
.term { font-size: 12.5px; font-weight: 700; fill: #1f2933; }
.note { font-size: 12px; fill: #52606d; }
.warn { font-size: 12px; font-weight: 700; fill: #b42318; }
.pico { fill: #edf7ef; stroke: #2f8a4c; stroke-width: 2; }
.usb { fill: #d9dee4; stroke: #616e7c; stroke-width: 1.5; }
.tang { fill: #f7f8fa; stroke: #323f4b; stroke-width: 2.2; }
.part { fill: #ffffff; stroke: #616e7c; stroke-width: 1.8; }
.free { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.3; }
</style>
<rect class="bg" width="900" height="740"/>
<rect x="600" y="50" width="230" height="648" rx="10" class="pico"/>
<rect x="691.0" y="40" width="48" height="26" rx="4" class="usb"/>
<text x="715.0" y="86" class="sub" text-anchor="middle">USB</text>
<text x="715.0" y="664" class="title" text-anchor="middle">Raspberry Pi</text>
<text x="715.0" y="684" class="sub" text-anchor="middle">Pico 2 W, from the top</text>
<circle cx="616" cy="120" r="6" class="free"/>
<text x="630" y="124" class="num" text-anchor="start">1</text>
<text x="652" y="124" class="pin" text-anchor="start">GP0</text>
<circle cx="616" cy="146" r="6" class="free"/>
<text x="630" y="150" class="num" text-anchor="start">2</text>
<text x="652" y="150" class="pin" text-anchor="start">GP1</text>
<circle cx="616" cy="172" r="7" fill="#111827"/>
<text x="630" y="176" class="numu" text-anchor="start">3</text>
<text x="652" y="176" class="pinu" text-anchor="start">GND</text>
<circle cx="616" cy="198" r="7" fill="#d97706"/>
<text x="630" y="202" class="numu" text-anchor="start">4</text>
<text x="652" y="202" class="pinu" text-anchor="start">GP2</text>
