# Golden model checks (sim/model): ISA conformance, PAU and chip model, reference devices and the
# protocol programs, all in Python. A few seconds; no simulator or PDK needed.
name: model

on:
  push:
    paths:
      - 'sim/model/**'
      - 'test/model/**'
      - 'test/shared/**'
      - 'programs/**'
      - '.github/workflows/model.yaml'
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Model tests
        run: |
          for t in test/model/test_*.py; do python3 "$t"; done
          (cd test/shared && python3 test_devices.py)

      - name: Protocol programs and their table
        run: |
          python3 programs/report.py
          git diff --exit-code programs/README.md   # the committed table must match the tests
