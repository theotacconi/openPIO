# Tiny Tapeout IHP SG13G2 hardening (copied from TinyTapeout/ttihp-verilog-template).
# gds: LibreLane 3.0.5 flow via tt_tool --harden; precheck: TT KLayout DRC and
# submission checks on the final GDS; viewer: 3D GDS viewer on GitHub Pages.
# The template's gl_test job is omitted until a cocotb tb exists under test/.
name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26b
