# Tiny Tapeout IHP SG13CMOS5L hardening (copied from TinyTapeout/ttihp-verilog-template, branch cmos5l).
# gds: LibreLane flow (3.1.0.dev3, action default) via tt_tool --harden; precheck: TT KLayout DRC and
# submission checks on the final GDS; viewer: 3D GDS viewer on GitHub Pages; signoff: scripts/tt_signoff.py
# on the run logs, red on any DRC/LVS/antenna/slew/cap error or negative setup/hold slack (all corners);
# gl_test: the cocotb tests (test/) on the hardened gate-level netlist.
name: gds

on:
  # Only when the hardened design or this flow changes; run by hand (Actions > gds > Run workflow)
  # on the commit to submit, so its tt_submission artifact has the current docs/info.md.
  push:
    paths:
      - 'src/**'
      - 'info.yaml'
      - '.github/workflows/gds.yaml'
      - 'scripts/tt_signoff.py'
      - 'librelane_plugin_openpio_pdn.py'
      - 'odb_stripes.py'
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  signoff:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Download run logs
        uses: actions/download-artifact@v7
        with:
          name: GDS_logs
          path: gds_logs

      - name: Sign-off
        shell: bash
        run: |
          rc=0
          { echo '```'; python3 scripts/tt_signoff.py gds_logs/runs/wokwi; } | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
