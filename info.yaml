project:
  title:        "openPIO"
  author:       "Matteo Tacconi"
  discord:      ""
  description:  "Programmable I/O co-processor: two state machines for serial protocols, with a protocol acceleration unit"
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "6x4"

  top_module:  "tt_um_theotacconi_openpio"

  source_files:
    - "tt_um_openpio.v"
    - "spi_cfg_interface.v"
    - "fifo.v"
    - "openpio_core.v"
    - "pau.v"
    - "shifter.v"
    - "alu.v"
    - "imem_sram.v"     # IHP SRAM macro; imem.v is the RTL/FPGA model
    - "sram_blackbox.v" # its ports, for lint and synthesis

pinout:
  ui[0]: "HOST_SCK"      # SPI slave clock, mode 0, <= clk/6
  ui[1]: "HOST_MOSI"     # SPI slave data in
  ui[2]: "HOST_CS_N"     # SPI slave chip select (active low)
  ui[3]: "PIO_IN_11"      # pin 8 + k input (pins 11..15)
  ui[4]: "PIO_IN_12"
  ui[5]: "PIO_IN_13"
  ui[6]: "PIO_IN_14"
  ui[7]: "PIO_IN_15"

  uo[0]: "HOST_MISO"     # SPI Slave Data Out
  uo[1]: "HOST_IRQ"      # high while an SM requests it (IRQ flags, FIFO levels; IRQ_MASK)
  uo[2]: "PIO_OUT_10"     # pin 8 + k output, always driven (pins 10..15)
  uo[3]: "PIO_OUT_11"
  uo[4]: "PIO_OUT_12"
  uo[5]: "PIO_OUT_13"
  uo[6]: "PIO_OUT_14"
  uo[7]: "PIO_OUT_15"

  uio[0]: "PIO_IO_0"      # pin i, bidirectional: out = pin latch or PAU TX, oe = direction latch, in = pad
  uio[1]: "PIO_IO_1"
  uio[2]: "PIO_IO_2"
  uio[3]: "PIO_IO_3"
  uio[4]: "PIO_IO_4"
  uio[5]: "PIO_IO_5"
  uio[6]: "PIO_IO_6"
  uio[7]: "PIO_IO_7"

# Do not change!
yaml_version: 6
