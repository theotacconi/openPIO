project:
  title:        "openPIO"
  author:       "Matteo Tacconi"
  discord:      ""
  description:  "General-purpose hardware protocol emulator ASIC with PAU acceleration"
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "6x4"

  top_module:  "tt_um_theotacconi_openpio"

  source_files:
    - "tt_um_openpio.v"
    - "spi_cfg_interface.v"
    - "fifo.v"
    - "openpio_core.v"
    - "pau.v"
    - "shifter.v"
    - "alu.v"
    - "imem_sram.v"     # IHP SRAM macro; imem.v is the RTL/FPGA model

pinout:
  ui[0]: "HOST_SCK"      # SPI slave clock, mode 0, <= clk/12
  ui[1]: "HOST_MOSI"     # SPI slave data in
  ui[2]: "HOST_CS_N"     # SPI slave chip select (active low)
  ui[3]: "GPIO_IN_3"     # replaces uio_in[3] as gpio_in[3] when GPIO.in_sel[3] = 1
  ui[4]: "GPIO_IN_4"     # same, gpio_in[4]
  ui[5]: "GPIO_IN_5"     # same, gpio_in[5]
  ui[6]: "GPIO_IN_6"     # same, gpio_in[6]
  ui[7]: "GPIO_IN_7"     # same, gpio_in[7]

  uo[0]: "HOST_MISO"     # SPI Slave Data Out
  uo[1]: "HOST_IRQ"      # OR of the 8 local IRQ flags
  uo[2]: "GPIO_OUT_2"    # push-pull mirror of gpio_out[2] (uo[3..7] likewise)
  uo[3]: "GPIO_OUT_3"
  uo[4]: "GPIO_OUT_4"
  uo[5]: "GPIO_OUT_5"
  uo[6]: "GPIO_OUT_6"
  uo[7]: "GPIO_OUT_7"

  uio[0]: "PIO_IO_0"      # gpio[i]: out = gpio_out, oe = pindirs, in = pad (all uio)
  uio[1]: "PIO_IO_1"
  uio[2]: "PIO_IO_2"
  uio[3]: "PIO_IO_3"
  uio[4]: "PIO_IO_4"
  uio[5]: "PIO_IO_5"
  uio[6]: "PIO_IO_6"
  uio[7]: "PIO_IO_7"

# Do not change!
yaml_version: 6
