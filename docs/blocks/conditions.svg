<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" role="img" aria-labelledby="t d">
<title id="t">Conditions</title>
<desc id="d">Each of the 4 condition slots picks a signal (a pin, a flag, a bit of X or Y, a status bit), may invert it, and gives a true/false value to JMP and WAIT; WAIT can also wait for a change.</desc>
<style>
.bg { fill: #ffffff; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
.h { font-size: 15px; font-weight: 700; }
.d { font-size: 13px; fill: #3e4c59; }
.small { font-size: 11.5px; fill: #7b8794; }
.ld { font-size: 12.5px; fill: #1d5fbf; }
.lc { font-size: 12.5px; fill: #52606d; }
.term { font-size: 12.5px; font-weight: 700; fill: #1f2933; }
.def { font-size: 12.5px; fill: #3e4c59; }
.group { font-size: 12.5px; font-weight: 700; fill: #616e7c; }
.chiptitle { font-size: 17px; font-weight: 700; }
.smtitle { font-size: 15px; font-weight: 700; }
.b { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.5; }
.bar { fill: #f0f2f5; stroke: #9aa5b1; stroke-width: 1.5; }
.chip { fill: #f7f8fa; stroke: #323f4b; stroke-width: 2.5; }
.sm { fill: #ffffff; stroke: #616e7c; stroke-width: 1.8; }
.core { fill: #f7f8fa; stroke: #cbd2d9; stroke-width: 1.2; stroke-dasharray: 5 4; }
.q { fill: #e8f0fc; stroke: #1d5fbf; stroke-width: 1.5; }
.pau { fill: #eef7f0; stroke: #2f8a4c; stroke-width: 1.5; }
.sel { fill: #fff8e6; stroke: #b7791f; stroke-width: 1.5; }
.legend { fill: #f7f8fa; stroke: #cbd2d9; stroke-width: 1.2; }
.data { fill: none; stroke: #1d5fbf; stroke-width: 2.2; }
.ctl { fill: none; stroke: #7b8794; stroke-width: 1.6; }
.dash { fill: none; stroke: #1d5fbf; stroke-width: 1.8; stroke-dasharray: 6 5; }
.ah-data, .ah-dash { fill: #1d5fbf; }
.ah-ctl { fill: #7b8794; }
.cell { fill: #ffffff; stroke: #b7791f; stroke-width: 1.3; }
</style>
<defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-data"/></marker><marker id="datas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah-data"/></marker><marker id="ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-ctl"/></marker><marker id="ctls" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah-ctl"/></marker><marker id="dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-dash"/></marker><marker id="dashs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah-dash"/></marker></defs>
<rect x="0" y="0" width="1240" height="780" rx="18" class="bg"/>
<text x="40" y="36" class="group" text-anchor="start">4 slots (COND0 … COND3), each one test. The host sets them; a program can rewrite one.</text>
<polygon points="300,70 330,84 330,296 300,310" class="sel"/>
<text x="315.0" y="62" class="small" text-anchor="middle">what to test</text>
<text x="290" y="86.0" class="d" text-anchor="end">pin n</text>
<polyline points="292,82.0 299,82.0" class="ctl"/>
<text x="290" y="116.85714285714286" class="d" text-anchor="end">pin in_base + n</text>
<polyline points="292,112.85714285714286 299,112.85714285714286" class="ctl"/>
<text x="290" y="147.71428571428572" class="d" text-anchor="end">IRQ flag n (own)</text>
<polyline points="292,143.71428571428572 299,143.71428571428572" class="ctl"/>
<text x="290" y="178.57142857142856" class="d" text-anchor="end">IRQ flag n (other machine)</text>
<polyline points="292,174.57142857142856 299,174.57142857142856" class="ctl"/>
<text x="290" y="209.42857142857144" class="d" text-anchor="end">bit n of X</text>
<polyline points="292,205.42857142857144 299,205.42857142857144" class="ctl"/>
<text x="290" y="240.28571428571428" class="d" text-anchor="end">bit n of Y</text>
<polyline points="292,236.28571428571428 299,236.28571428571428" class="ctl"/>
<text x="290" y="271.1428571428571" class="d" text-anchor="end">SM status bit n</text>
<polyline points="292,267.1428571428571 299,267.1428571428571" class="ctl"/>
<text x="290" y="302.0" class="d" text-anchor="end">PAU status bit n</text>
<polyline points="292,298.0 299,298.0" class="ctl"/>
<polyline points="330,190.0 398,190.0" class="data" marker-end="url(#data)"/>
<rect x="400" y="155" width="120" height="70" rx="8" class="b"/>
<text x="460.0" y="186.5" class="h" text-anchor="middle">Invert?</text>
<text x="460.0" y="203.5" class="d" text-anchor="middle">true ↔ false</text>
<polyline points="520,190 598,190" class="data" marker-end="url(#data)"/>
<rect x="600" y="155" width="150" height="70" rx="8" class="b"/>
<text x="675.0" y="186.5" class="h" text-anchor="middle">Value now</text>
<text x="675.0" y="203.5" class="d" text-anchor="middle">true or false</text>
<polyline points="750,175 848,175" class="data" marker-end="url(#data)"/>
<text x="856" y="179" class="d" text-anchor="start">JMP: jump if true</text>
<rect x="600" y="265" width="150" height="70" rx="8" class="b"/>
<text x="675.0" y="296.5" class="h" text-anchor="middle">Value at the</text>
<text x="675.0" y="313.5" class="d" text-anchor="middle">previous step</text>
<polyline points="675,225 675,263" class="ctl" marker-end="url(#ctl)"/>
<polyline points="750,300 800,300 800,210 848,210" class="data" marker-end="url(#data)"/>
<text x="856" y="205" class="d" text-anchor="start">WAIT: until true or false,</text>
<text x="856" y="222" class="d" text-anchor="start">or until it changes (an edge)</text>
<rect x="860" y="270" width="340" height="80" rx="8" class="b"/>
<text x="1030.0" y="298.0" class="h" text-anchor="middle">Timeout</text>
<text x="1030.0" y="315.0" class="d" text-anchor="middle">a WAIT … timeout also ends after</text>
<text x="1030.0" y="332.0" class="d" text-anchor="middle">TIMEOUT_VAL steps; sets the timeout flag</text>
<rect x="40" y="360" width="520" height="280" rx="8" class="b"/>
<text x="300" y="390" class="h" text-anchor="middle">SM status bits (SM = state machine)</text>
<text x="70" y="422" class="def" text-anchor="start">0</text>
<text x="100" y="422" class="term" text-anchor="start">x_zero</text>
<text x="220" y="422" class="def" text-anchor="start">X == 0</text>
<text x="70" y="448" class="def" text-anchor="start">1</text>
<text x="100" y="448" class="term" text-anchor="start">y_zero</text>
<text x="220" y="448" class="def" text-anchor="start">Y == 0</text>
<text x="70" y="474" class="def" text-anchor="start">2</text>
<text x="100" y="474" class="term" text-anchor="start">x_eq_y</text>
<text x="220" y="474" class="def" text-anchor="start">X == Y</text>
<text x="70" y="500" class="def" text-anchor="start">3</text>
<text x="100" y="500" class="term" text-anchor="start">timeout</text>
<text x="220" y="500" class="def" text-anchor="start">a WAIT timed out</text>
<text x="70" y="526" class="def" text-anchor="start">4</text>
<text x="100" y="526" class="term" text-anchor="start">osr_empty</text>
<text x="220" y="526" class="def" text-anchor="start">OSR used up</text>
<text x="70" y="552" class="def" text-anchor="start">5</text>
<text x="100" y="552" class="term" text-anchor="start">isr_full</text>
<text x="220" y="552" class="def" text-anchor="start">ISR filled</text>
<text x="70" y="578" class="def" text-anchor="start">6</text>
<text x="100" y="578" class="term" text-anchor="start">tx_empty</text>
<text x="220" y="578" class="def" text-anchor="start">TX FIFO empty</text>
<text x="70" y="604" class="def" text-anchor="start">7</text>
<text x="100" y="604" class="term" text-anchor="start">rx_full</text>
<text x="220" y="604" class="def" text-anchor="start">RX FIFO full</text>
<rect x="600" y="360" width="600" height="280" rx="8" class="b"/>
<text x="900" y="390" class="h" text-anchor="middle">PAU status bits</text>
<text x="630" y="422" class="def" text-anchor="start">0</text>
<text x="655" y="422" class="term" text-anchor="start">tx_idle</text>
<text x="740" y="422" class="def" text-anchor="start">everything sent</text>
<text x="630" y="448" class="def" text-anchor="start">1</text>
<text x="655" y="448" class="term" text-anchor="start">rx_idle</text>
<text x="740" y="448" class="def" text-anchor="start">line quiet</text>
<text x="630" y="474" class="def" text-anchor="start">2</text>
<text x="655" y="474" class="term" text-anchor="start">tx_ready</text>
<text x="740" y="474" class="def" text-anchor="start">room in the TX queue</text>
<text x="630" y="500" class="def" text-anchor="start">3</text>
<text x="655" y="500" class="term" text-anchor="start">rx_ready</text>
<text x="740" y="500" class="def" text-anchor="start">bits received</text>
<text x="630" y="526" class="def" text-anchor="start">4</text>
<text x="655" y="526" class="term" text-anchor="start">crc_ok</text>
<text x="740" y="526" class="def" text-anchor="start">CRC correct</text>
<text x="630" y="552" class="def" text-anchor="start">5</text>
<text x="655" y="552" class="term" text-anchor="start">crc_zero</text>
<text x="740" y="552" class="def" text-anchor="start">CRC is 0</text>
<text x="905" y="422" class="def" text-anchor="start">6</text>
<text x="935" y="422" class="term" text-anchor="start">stuff_err</text>
<text x="1020" y="422" class="def" text-anchor="start">bad stuffing bit</text>
<text x="905" y="448" class="def" text-anchor="start">7</text>
<text x="935" y="448" class="term" text-anchor="start">overrun</text>
<text x="1020" y="448" class="def" text-anchor="start">bits were lost</text>
<text x="905" y="474" class="def" text-anchor="start">8</text>
<text x="935" y="474" class="term" text-anchor="start">se0</text>
<text x="1020" y="474" class="def" text-anchor="start">both lines low</text>
<text x="905" y="500" class="def" text-anchor="start">9</text>
<text x="935" y="500" class="term" text-anchor="start">se1</text>
<text x="1020" y="500" class="def" text-anchor="start">both lines high</text>
<text x="905" y="526" class="def" text-anchor="start">10</text>
<text x="935" y="526" class="term" text-anchor="start">bit_err</text>
<text x="1020" y="526" class="def" text-anchor="start">line ≠ bit sent</text>
<rect x="40" y="670" width="1160" height="100" rx="8" class="legend"/>
<text x="56" y="694" class="group" text-anchor="start">Legend</text>
<polyline points="130,690 164,690" class="data" marker-end="url(#data)"/>
<text x="174" y="694" class="def" text-anchor="start">data</text>
<polyline points="232.8,690 266.8,690" class="ctl" marker-end="url(#ctl)"/>
<text x="276.8" y="694" class="def" text-anchor="start">control, settings</text>
<polygon points="429.20000000000005,680 445.20000000000005,686 445.20000000000005,694 429.20000000000005,700" class="sel"/>
<text x="453.20000000000005" y="694" class="def" text-anchor="start">selector: passes one input, chosen by the instruction</text>
<text x="56.0" y="724" class="def"><tspan class="term">JMP / WAIT</tspan>  jump if true / pause until true</text>
<text x="56.0" y="745" class="def"><tspan class="term">IRQ</tspan>  Interrupt ReQuest flag</text>
<text x="432.0" y="724" class="def"><tspan class="term">SM</tspan>  state machine</text>
<text x="432.0" y="745" class="def"><tspan class="term">PAU</tspan>  Protocol Acceleration Unit</text>
<text x="808.0" y="724" class="def"><tspan class="term">in_base</tspan>  first input pin of this machine</text>
<text x="808.0" y="745" class="def"><tspan class="term">CRC</tspan>  Cyclic Redundancy Check (a checksum)</text>
</svg>
