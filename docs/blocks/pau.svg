<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-labelledby="t d">
<title id="t">PAU: Protocol Acceleration Unit</title>
<desc id="d">An optional serial engine between the shift registers and the pins. Transmitting, it queues the bits, inserts stuffing bits and encodes the line; receiving, it recovers the bit timing, removes the stuffing bits and queues the bits. A CRC unit checks or appends a checksum; a monitor stops sending if the line disagrees.</desc>
<style>
.bg { fill: #ffffff; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
.h { font-size: 15px; font-weight: 700; }
.d { font-size: 13px; fill: #3e4c59; }
.small { font-size: 11.5px; fill: #7b8794; }
.ld { font-size: 12.5px; fill: #1d5fbf; }
.lc { font-size: 12.5px; fill: #52606d; }
.term { font-size: 12.5px; font-weight: 700; fill: #1f2933; }
.def { font-size: 12.5px; fill: #3e4c59; }
.group { font-size: 12.5px; font-weight: 700; fill: #616e7c; }
.chiptitle { font-size: 17px; font-weight: 700; }
.smtitle { font-size: 15px; font-weight: 700; }
.b { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.5; }
.bar { fill: #f0f2f5; stroke: #9aa5b1; stroke-width: 1.5; }
.chip { fill: #f7f8fa; stroke: #323f4b; stroke-width: 2.5; }
.sm { fill: #ffffff; stroke: #616e7c; stroke-width: 1.8; }
.core { fill: #f7f8fa; stroke: #cbd2d9; stroke-width: 1.2; stroke-dasharray: 5 4; }
.q { fill: #e8f0fc; stroke: #1d5fbf; stroke-width: 1.5; }
.pau { fill: #eef7f0; stroke: #2f8a4c; stroke-width: 1.5; }
.sel { fill: #fff8e6; stroke: #b7791f; stroke-width: 1.5; }
.legend { fill: #f7f8fa; stroke: #cbd2d9; stroke-width: 1.2; }
.data { fill: none; stroke: #1d5fbf; stroke-width: 2.2; }
.ctl { fill: none; stroke: #7b8794; stroke-width: 1.6; }
.dash { fill: none; stroke: #1d5fbf; stroke-width: 1.8; stroke-dasharray: 6 5; }
.ah-data, .ah-dash { fill: #1d5fbf; }
.ah-ctl { fill: #7b8794; }
.cell { fill: #ffffff; stroke: #b7791f; stroke-width: 1.3; }
</style>
<defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-data"/></marker><marker id="datas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah-data"/></marker><marker id="ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-ctl"/></marker><marker id="ctls" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah-ctl"/></marker><marker id="dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-dash"/></marker><marker id="dashs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah-dash"/></marker></defs>
<rect x="0" y="0" width="1240" height="760" rx="18" class="bg"/>
<text x="40" y="36" class="group" text-anchor="start">Transmit (when TX is on)</text>
<text x="40" y="84" class="term" text-anchor="start">OUT pins, n</text>
<text x="40" y="102" class="small" text-anchor="start">bits from the OSR</text>
<polyline points="170,90 218,90" class="data" marker-end="url(#data)"/>
<rect x="220" y="60" width="170" height="60" rx="8" class="q"/>
<text x="305.0" y="86.5" class="h" text-anchor="middle">TX queue</text>
<text x="305.0" y="103.5" class="d" text-anchor="middle">32 bits waiting</text>
<polyline points="390,90 438,90" class="data" marker-end="url(#data)"/>
<rect x="440" y="55" width="220" height="70" rx="8" class="pau"/>
<text x="550.0" y="78.0" class="h" text-anchor="middle">Stuffing</text>
<text x="550.0" y="95.0" class="d" text-anchor="middle">adds a bit after a run</text>
<text x="550.0" y="112.0" class="d" text-anchor="middle">of N bits (USB, CAN)</text>
<polyline points="660,90 708,90" class="data" marker-end="url(#data)"/>
<rect x="710" y="55" width="230" height="70" rx="8" class="pau"/>
<text x="825.0" y="78.0" class="h" text-anchor="middle">Encoder</text>
<text x="825.0" y="95.0" class="d" text-anchor="middle">bit → line: NRZ, NRZI,</text>
<text x="825.0" y="112.0" class="d" text-anchor="middle">Manchester, BMC</text>
<polyline points="940,90 1008,90" class="data" marker-end="url(#data)"/>
<text x="1016" y="86" class="term" text-anchor="start">pin out_base</text>
<text x="1016" y="104" class="small" text-anchor="start">(+1 inverted, DIFF)</text>
<text x="40" y="196" class="group" text-anchor="start">Receive (when RX is on)</text>
<text x="1016" y="244" class="term" text-anchor="start">pin in_base</text>
<text x="1016" y="262" class="small" text-anchor="start">(+1 for DIFF)</text>
<polyline points="1008,250 942,250" class="data" marker-end="url(#data)"/>
<rect x="710" y="215" width="230" height="70" rx="8" class="pau"/>
<text x="825.0" y="238.0" class="h" text-anchor="middle">Decoder</text>
<text x="825.0" y="255.0" class="d" text-anchor="middle">finds the bit timing</text>
<text x="825.0" y="272.0" class="d" text-anchor="middle">from the line&#x27;s edges</text>
<polyline points="708,250 662,250" class="data" marker-end="url(#data)"/>
<rect x="440" y="215" width="220" height="70" rx="8" class="pau"/>
<text x="550.0" y="238.0" class="h" text-anchor="middle">Destuffing</text>
<text x="550.0" y="255.0" class="d" text-anchor="middle">removes the added bit;</text>
<text x="550.0" y="272.0" class="d" text-anchor="middle">a wrong one: stuff_err</text>
<polyline points="438,250 392,250" class="data" marker-end="url(#data)"/>
<rect x="220" y="220" width="170" height="60" rx="8" class="q"/>
<text x="305.0" y="246.5" class="h" text-anchor="middle">RX queue</text>
<text x="305.0" y="263.5" class="d" text-anchor="middle">32 bits waiting</text>
<polyline points="218,250 172,250" class="data" marker-end="url(#data)"/>
<text x="40" y="244" class="term" text-anchor="start">IN pins, n</text>
<text x="40" y="262" class="small" text-anchor="start">bits to the ISR</text>
<rect x="220" y="330" width="440" height="80" rx="8" class="b"/>
<text x="440.0" y="358.0" class="h" text-anchor="middle">CRC: checksum, 1 to 32 bits</text>
<text x="440.0" y="375.0" class="d" text-anchor="middle">fed a bit a strobe: data bits sent or received, or the ISR</text>
<text x="440.0" y="392.0" class="d" text-anchor="middle">appends it when sending · checks it when receiving</text>
<polyline points="415,90 415,328" class="ctl" marker-end="url(#ctl)"/>
<polyline points="560,287 560,328" class="ctl" marker-end="url(#ctl)"/>
<rect x="710" y="330" width="230" height="80" rx="8" class="b"/>
<text x="825.0" y="358.0" class="h" text-anchor="middle">Monitor</text>
<text x="825.0" y="375.0" class="d" text-anchor="middle">compares each bit sent with</text>
<text x="825.0" y="392.0" class="d" text-anchor="middle">pin in_base: bit_err, stop</text>
<rect x="40" y="450" width="560" height="110" rx="8" class="b"/>
<text x="320.0" y="477.0" class="h" text-anchor="middle">The program controls it</text>
<text x="320.0" y="499.0" class="d" text-anchor="middle">SET pau_ctl: tx, rx, stuff, crc, monitor (on / off)</text>
<text x="320.0" y="521.0" class="d" text-anchor="middle">SET pau_baud: H = steps per half bit</text>
<text x="320.0" y="543.0" class="d" text-anchor="middle">pau crc_reset · crc_append · tx_abort · crc_feed n</text>
<rect x="640" y="450" width="560" height="110" rx="8" class="b"/>
<text x="920.0" y="477.0" class="h" text-anchor="middle">The host sets it up</text>
<text x="920.0" y="499.0" class="d" text-anchor="middle">PAU_MODE: line code, invert, stuffing rule, baud</text>
<text x="920.0" y="521.0" class="d" text-anchor="middle">CRC_CFG, CRC_POLY: which checksum</text>
<text x="920.0" y="543.0" class="d" text-anchor="middle">CRC_RES: the value of a correct frame</text>
<text x="1200" y="436" class="small" text-anchor="end">11 status bits go to the conditions</text>
<rect x="40" y="590" width="1160" height="142" rx="8" class="legend"/>
<text x="56" y="614" class="group" text-anchor="start">Legend</text>
<polyline points="130,610 164,610" class="data" marker-end="url(#data)"/>
<text x="174" y="614" class="def" text-anchor="start">data</text>
<polyline points="232.8,610 266.8,610" class="ctl" marker-end="url(#ctl)"/>
<text x="276.8" y="614" class="def" text-anchor="start">control, settings</text>
<text x="56.0" y="644" class="def"><tspan class="term">PAU</tspan>  Protocol Acceleration Unit</text>
<text x="56.0" y="665" class="def"><tspan class="term">TX / RX</tspan>  transmit / receive</text>
<text x="56.0" y="686" class="def"><tspan class="term">NRZ</tspan>  Non-Return-to-Zero: the line is the bit</text>
<text x="56.0" y="707" class="def"><tspan class="term">NRZI</tspan>  NRZ Inverted: a 0 flips the line (USB)</text>
<text x="620.0" y="644" class="def"><tspan class="term">Manchester</tspan>  two halves per bit, 1 = low→high (Ethernet)</text>
<text x="620.0" y="665" class="def"><tspan class="term">BMC</tspan>  Biphase Mark Code: a flip every bit, two for a 1</text>
<text x="620.0" y="686" class="def"><tspan class="term">DIFF</tspan>  differential: a second pin with the opposite level</text>
<text x="620.0" y="707" class="def"><tspan class="term">CRC</tspan>  Cyclic Redundancy Check: a checksum</text>
</svg>
