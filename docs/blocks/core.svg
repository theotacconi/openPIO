<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-labelledby="t d">
<title id="t">Program and control</title>
<desc id="d">The clock divider makes the steps; the program counter picks the instruction; the program memory gives it; its three fields go to the control, to the delay and side-set logic, and to the blocks as arguments.</desc>
<style>
.bg { fill: #ffffff; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
.h { font-size: 15px; font-weight: 700; }
.d { font-size: 13px; fill: #3e4c59; }
.small { font-size: 11.5px; fill: #7b8794; }
.ld { font-size: 12.5px; fill: #1d5fbf; }
.lc { font-size: 12.5px; fill: #52606d; }
.term { font-size: 12.5px; font-weight: 700; fill: #1f2933; }
.def { font-size: 12.5px; fill: #3e4c59; }
.group { font-size: 12.5px; font-weight: 700; fill: #616e7c; }
.chiptitle { font-size: 17px; font-weight: 700; }
.smtitle { font-size: 15px; font-weight: 700; }
.b { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.5; }
.bar { fill: #f0f2f5; stroke: #9aa5b1; stroke-width: 1.5; }
.chip { fill: #f7f8fa; stroke: #323f4b; stroke-width: 2.5; }
.sm { fill: #ffffff; stroke: #616e7c; stroke-width: 1.8; }
.core { fill: #f7f8fa; stroke: #cbd2d9; stroke-width: 1.2; stroke-dasharray: 5 4; }
.q { fill: #e8f0fc; stroke: #1d5fbf; stroke-width: 1.5; }
.pau { fill: #eef7f0; stroke: #2f8a4c; stroke-width: 1.5; }
.sel { fill: #fff8e6; stroke: #b7791f; stroke-width: 1.5; }
.legend { fill: #f7f8fa; stroke: #cbd2d9; stroke-width: 1.2; }
.data { fill: none; stroke: #1d5fbf; stroke-width: 2.2; }
.ctl { fill: none; stroke: #7b8794; stroke-width: 1.6; }
.dash { fill: none; stroke: #1d5fbf; stroke-width: 1.8; stroke-dasharray: 6 5; }
.ah-data, .ah-dash { fill: #1d5fbf; }
.ah-ctl { fill: #7b8794; }
.cell { fill: #ffffff; stroke: #b7791f; stroke-width: 1.3; }
</style>
<defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-data"/></marker><marker id="datas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah-data"/></marker><marker id="ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-ctl"/></marker><marker id="ctls" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah-ctl"/></marker><marker id="dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-dash"/></marker><marker id="dashs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah-dash"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="18" class="bg"/>
<rect x="40" y="40" width="230" height="80" rx="8" class="b"/>
<text x="155.0" y="68.0" class="h" text-anchor="middle">Clock divider</text>
<text x="155.0" y="85.0" class="d" text-anchor="middle">CLKDIV: 1 to 255.99 clocks</text>
<text x="155.0" y="102.0" class="d" text-anchor="middle">→ one step</text>
<polyline points="270,80 1000,80 1000,128" class="ctl" marker-end="url(#ctl)"/>
<text x="640" y="70" class="lc" text-anchor="middle">step: every block below acts only on a step</text>
<polygon points="330,170 360,184 360,356 330,370" class="sel"/>
<text x="345.0" y="162" class="small" text-anchor="middle">next instruction</text>
<text x="320" y="186.0" class="d" text-anchor="end">PC + 1, or back to the loop start</text>
<polyline points="322,182.0 329,182.0" class="ctl"/>
<text x="320" y="244.66666666666666" class="d" text-anchor="end">JMP: the jump target</text>
<polyline points="322,240.66666666666666 329,240.66666666666666" class="ctl"/>
<text x="320" y="303.3333333333333" class="d" text-anchor="end">OUT PC: a computed jump</text>
<polyline points="322,299.3333333333333 329,299.3333333333333" class="ctl"/>
<text x="320" y="362.0" class="d" text-anchor="end">host write, or RESET → 0</text>
<polyline points="322,358.0 329,358.0" class="ctl"/>
<polyline points="360,270.0 418,270.0" class="data" marker-end="url(#data)"/>
<rect x="420" y="235" width="130" height="70" rx="8" class="b"/>
<text x="485.0" y="258.0" class="h" text-anchor="middle">PC</text>
<text x="485.0" y="275.0" class="d" text-anchor="middle">Program Counter</text>
<text x="485.0" y="292.0" class="d" text-anchor="middle">instruction 0 … 63</text>
<polyline points="550,270 598,270" class="data" marker-end="url(#data)"/>
<text x="574" y="262" class="ld" text-anchor="middle">address</text>
<rect x="600" y="215" width="190" height="110" rx="8" class="b"/>
<text x="695.0" y="249.5" class="h" text-anchor="middle">Program memory</text>
<text x="695.0" y="266.5" class="d" text-anchor="middle">64 instructions</text>
<text x="695.0" y="283.5" class="d" text-anchor="middle">of 16 bits each</text>
<text x="695.0" y="300.5" class="d" text-anchor="middle">written by the host</text>
<polyline points="790,270 858,270" class="data" marker-end="url(#data)"/>
<text x="824" y="262" class="ld" text-anchor="middle">instruction</text>
<line x1="860" y1="150" x2="860" y2="420" class="data"/>
<text x="868" y="168" class="ld" text-anchor="start">bits 15–13</text>
<polyline points="860,175 938,175" class="data" marker-end="url(#data)"/>
<rect x="940" y="130" width="260" height="90" rx="8" class="b"/>
<text x="1070.0" y="163.0" class="h" text-anchor="middle">Control</text>
<text x="1070.0" y="180.0" class="d" text-anchor="middle">decides what every block does</text>
<text x="1070.0" y="197.0" class="d" text-anchor="middle">on this step, or waits (stall)</text>
<text x="868" y="268" class="ld" text-anchor="start">bits 12–8</text>
<polyline points="860,275 938,275" class="data" marker-end="url(#data)"/>
<rect x="940" y="240" width="260" height="80" rx="8" class="b"/>
<text x="1070.0" y="268.0" class="h" text-anchor="middle">Delay and side-set</text>
<text x="1070.0" y="285.0" class="d" text-anchor="middle">after it: wait n × DLYMUL steps</text>
<text x="1070.0" y="302.0" class="d" text-anchor="middle">with it: set some pins</text>
<text x="868" y="368" class="ld" text-anchor="start">bits 7–0</text>
<polyline points="860,375 938,375" class="data" marker-end="url(#data)"/>
<text x="946" y="371" class="d" text-anchor="start">which register, how many bits,</text>
<text x="946" y="389" class="d" text-anchor="start">which condition, the jump target …</text>
<rect x="940" y="420" width="260" height="120" rx="8" class="b"/>
<text x="1070.0" y="447.0" class="h" text-anchor="middle">It waits (stalls) while</text>
<text x="1070.0" y="466.0" class="d" text-anchor="middle">a WAIT condition is false</text>
<text x="1070.0" y="485.0" class="d" text-anchor="middle">the FIFO it needs is empty / full</text>
<text x="1070.0" y="504.0" class="d" text-anchor="middle">the PAU queue lacks room / bits</text>
<text x="1070.0" y="523.0" class="d" text-anchor="middle">an IRQ it waits on is set</text>
<polyline points="1200,175 1222,175 1222,480 1202,480" class="ctl" marker-end="url(#ctl)"/>
<rect x="40" y="570" width="1160" height="121" rx="8" class="legend"/>
<text x="56" y="594" class="group" text-anchor="start">Legend</text>
<polyline points="130,590 164,590" class="data" marker-end="url(#data)"/>
<text x="174" y="594" class="def" text-anchor="start">data</text>
<polyline points="232.8,590 266.8,590" class="ctl" marker-end="url(#ctl)"/>
<text x="276.8" y="594" class="def" text-anchor="start">control, settings</text>
<polygon points="429.20000000000005,580 445.20000000000005,586 445.20000000000005,594 429.20000000000005,600" class="sel"/>
<text x="453.20000000000005" y="594" class="def" text-anchor="start">selector: passes one input, chosen by the instruction</text>
<text x="56.0" y="624" class="def"><tspan class="term">PC</tspan>  Program Counter: number of the instruction being run</text>
<text x="56.0" y="645" class="def"><tspan class="term">CLKDIV</tspan>  clock divider: clocks per step, set by the host</text>
<text x="56.0" y="666" class="def"><tspan class="term">JMP</tspan>  jump instruction; OUT PC jumps to bits taken from the OSR</text>
<text x="620.0" y="624" class="def"><tspan class="term">DLYMUL</tspan>  delay multiplier, set by the program (SET)</text>
<text x="620.0" y="645" class="def"><tspan class="term">RESET</tspan>  restart command from the host (register CTRL)</text>
<text x="620.0" y="666" class="def"><tspan class="term">side-set</tspan>  pins changed by the instruction itself, at no extra time</text>
</svg>
