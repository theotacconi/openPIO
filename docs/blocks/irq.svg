<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-labelledby="t d">
<title id="t">IRQ flags</title>
<desc id="d">Eight flags per state machine, set and cleared by the program, by the other state machine and by the host; they are tested by conditions and, through IRQ_MASK, raise the HOST_IRQ pin, as do the FIFO levels.</desc>
<style>
.bg { fill: #ffffff; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
.h { font-size: 15px; font-weight: 700; }
.d { font-size: 13px; fill: #3e4c59; }
.small { font-size: 11.5px; fill: #7b8794; }
.ld { font-size: 12.5px; fill: #1d5fbf; }
.lc { font-size: 12.5px; fill: #52606d; }
.term { font-size: 12.5px; font-weight: 700; fill: #1f2933; }
.def { font-size: 12.5px; fill: #3e4c59; }
.group { font-size: 12.5px; font-weight: 700; fill: #616e7c; }
.chiptitle { font-size: 17px; font-weight: 700; }
.smtitle { font-size: 15px; font-weight: 700; }
.b { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.5; }
.bar { fill: #f0f2f5; stroke: #9aa5b1; stroke-width: 1.5; }
.chip { fill: #f7f8fa; stroke: #323f4b; stroke-width: 2.5; }
.sm { fill: #ffffff; stroke: #616e7c; stroke-width: 1.8; }
.core { fill: #f7f8fa; stroke: #cbd2d9; stroke-width: 1.2; stroke-dasharray: 5 4; }
.q { fill: #e8f0fc; stroke: #1d5fbf; stroke-width: 1.5; }
.pau { fill: #eef7f0; stroke: #2f8a4c; stroke-width: 1.5; }
.sel { fill: #fff8e6; stroke: #b7791f; stroke-width: 1.5; }
.legend { fill: #f7f8fa; stroke: #cbd2d9; stroke-width: 1.2; }
.data { fill: none; stroke: #1d5fbf; stroke-width: 2.2; }
.ctl { fill: none; stroke: #7b8794; stroke-width: 1.6; }
.dash { fill: none; stroke: #1d5fbf; stroke-width: 1.8; stroke-dasharray: 6 5; }
.ah-data, .ah-dash { fill: #1d5fbf; }
.ah-ctl { fill: #7b8794; }
.cell { fill: #ffffff; stroke: #b7791f; stroke-width: 1.3; }
</style>
<defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-data"/></marker><marker id="datas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah-data"/></marker><marker id="ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-ctl"/></marker><marker id="ctls" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah-ctl"/></marker><marker id="dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-dash"/></marker><marker id="dashs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah-dash"/></marker></defs>
<rect x="0" y="0" width="1240" height="560" rx="18" class="bg"/>
<text x="40" y="70" class="term" text-anchor="start">irq n / irq clear n</text>
<text x="40" y="88" class="small" text-anchor="start">this state machine</text>
<polyline points="240,74 338,74" class="ctl" marker-end="url(#ctl)"/>
<text x="40" y="130" class="term" text-anchor="start">irq peer n</text>
<text x="40" y="148" class="small" text-anchor="start">the other state machine</text>
<polyline points="240,134 338,134" class="ctl" marker-end="url(#ctl)"/>
<text x="40" y="190" class="term" text-anchor="start">IRQ register</text>
<text x="40" y="208" class="small" text-anchor="start">the host sets or clears</text>
<polyline points="240,194 338,194" class="ctl" marker-end="url(#ctl)"/>
<text x="40" y="250" class="term" text-anchor="start">RESET</text>
<text x="40" y="268" class="small" text-anchor="start">clears all</text>
<polyline points="240,254 338,254" class="ctl" marker-end="url(#ctl)"/>
<rect x="340" y="50" width="300" height="230" rx="8" class="b"/>
<text x="490" y="80" class="h" text-anchor="middle">IRQ flags: 8 signals, 0 … 7</text>
<rect x="362" y="110" width="27" height="40" rx="4" class="cell"/>
<text x="375.5" y="135" class="d" text-anchor="middle">0</text>
<rect x="395" y="110" width="27" height="40" rx="4" class="cell"/>
<text x="408.5" y="135" class="d" text-anchor="middle">1</text>
<rect x="428" y="110" width="27" height="40" rx="4" class="cell"/>
<text x="441.5" y="135" class="d" text-anchor="middle">2</text>
<rect x="461" y="110" width="27" height="40" rx="4" class="cell"/>
<text x="474.5" y="135" class="d" text-anchor="middle">3</text>
<rect x="494" y="110" width="27" height="40" rx="4" class="cell"/>
<text x="507.5" y="135" class="d" text-anchor="middle">4</text>
<rect x="527" y="110" width="27" height="40" rx="4" class="cell"/>
<text x="540.5" y="135" class="d" text-anchor="middle">5</text>
<rect x="560" y="110" width="27" height="40" rx="4" class="cell"/>
<text x="573.5" y="135" class="d" text-anchor="middle">6</text>
<rect x="593" y="110" width="27" height="40" rx="4" class="cell"/>
<text x="606.5" y="135" class="d" text-anchor="middle">7</text>
<text x="490" y="186" class="d" text-anchor="middle">each one: set or clear</text>
<text x="490" y="206" class="small" text-anchor="middle">the other machine sees them too</text>
<polyline points="640,100 738,100" class="ctl" marker-end="url(#ctl)"/>
<text x="746" y="96" class="d" text-anchor="start">conditions: irq n, peer_irq n</text>
<text x="746" y="114" class="small" text-anchor="start">(JMP, WAIT)</text>
<polyline points="640,160 738,160" class="ctl" marker-end="url(#ctl)"/>
<text x="746" y="156" class="d" text-anchor="start">irq wait n: the program pauses</text>
<text x="746" y="174" class="small" text-anchor="start">until someone clears flag n</text>
<polyline points="640,240 680,240 680,330 738,330" class="ctl" marker-end="url(#ctl)"/>
<rect x="740" y="300" width="160" height="60" rx="8" class="b"/>
<text x="820.0" y="326.5" class="h" text-anchor="middle">IRQ_MASK</text>
<text x="820.0" y="343.5" class="d" text-anchor="middle">chooses what counts</text>
<text x="560" y="382" class="d" text-anchor="end">RX FIFO not empty  (mask bit 8)</text>
<polyline points="570,378 700,378 700,350 738,350" class="ctl" marker-end="url(#ctl)"/>
<text x="560" y="412" class="d" text-anchor="end">TX FIFO ≤ 64 words  (mask bit 9)</text>
<polyline points="570,408 720,408 720,356 738,356" class="ctl" marker-end="url(#ctl)"/>
<polyline points="900,330 978,330" class="ctl" marker-end="url(#ctl)"/>
<rect x="980" y="300" width="210" height="60" rx="8" class="b"/>
<text x="1085.0" y="326.5" class="h" text-anchor="middle">Any of them</text>
<text x="1085.0" y="343.5" class="d" text-anchor="middle">(and the other machine&#x27;s)</text>
<polyline points="1085,360 1085,418" class="ctl" marker-end="url(#ctl)"/>
<text x="1085" y="438" class="term" text-anchor="middle">HOST_IRQ pin → the host</text>
<rect x="40" y="470" width="1160" height="100" rx="8" class="legend"/>
<text x="56" y="494" class="group" text-anchor="start">Legend</text>
<polyline points="130,490 164,490" class="ctl" marker-end="url(#ctl)"/>
<text x="174" y="494" class="def" text-anchor="start">control signals</text>
<text x="56.0" y="524" class="def"><tspan class="term">IRQ</tspan>  Interrupt ReQuest: a flag that asks for attention</text>
<text x="56.0" y="545" class="def"><tspan class="term">IRQ_MASK</tspan>  host register: which requests reach HOST_IRQ</text>
<text x="620.0" y="524" class="def"><tspan class="term">HOST_IRQ</tspan>  the chip&#x27;s interrupt pin to the host</text>
<text x="620.0" y="545" class="def"><tspan class="term">FIFO</tspan>  First In, First Out queue of data words</text>
</svg>
